<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';" />
  <title>piqo</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <!-- Header -->
<!-- Header (LTR like Phia) -->
  <header class="header">
    <div class="header-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="6" fill="#18E6A3"/>
        <rect x="6.5" y="6" width="3.5" height="12" rx="1.75" fill="#0A0A0A"/>
        <circle cx="13" cy="11.5" r="3.5" fill="none" stroke="#0A0A0A" stroke-width="3.5"/>
      </svg>
      <span class="logo-text">piqo</span>
      <span class="header-badge">بتا</span>
    </div>
    <button id="popup-close-btn" class="header-close-btn">✕</button>
  </header>

<!-- محصول فعلی -->
  <div id="current-product" class="current-product hidden">
    <div class="product-card current">
      <div class="current-product-main">
        <img id="product-image" class="product-img" src="" alt="" onerror="this.style.display='none'" />
        <div class="product-info">
          <div id="product-store" class="current-store-name"></div>
          <div id="product-name" class="product-name"></div> <!-- Hidden to match the clean design -->
          <div id="product-price" class="product-price current-price"></div>
        </div>
      </div>
  
    </div>
  </div>

  <!-- وضعیت loading -->
  <div id="loading-state" class="state-container hidden">
    <div class="spinner"></div>
    <p class="state-text">در حال جستجو در فروشگاه‌ها...</p>
    <div class="store-tags">
      <span class="store-tag dk">دیجی‌کالا</span>
      <span class="store-tag tr">ترب</span>
      <span class="store-tag em">ایمالز</span>
    </div>
  </div>

  <!-- وضعیت خالی (قبل از شناسایی) -->
  <div id="empty-state" class="state-container">
    <div class="empty-icon">🛍️</div>
    <p class="state-text">به صفحه محصولی بروید</p>
    <p class="state-subtext">افزونه به‌طور خودکار بهترین قیمت را پیدا می‌کند</p>
    <div class="supported-stores">
      <div class="section-label">فروشگاه‌های پشتیبانی‌شده</div>
      <div class="store-list">
        <div class="store-item">
          <span class="store-dot" style="background:#E42112"></span>
          <span>دیجی‌کالا</span>
        </div>
        <div class="store-item">
          <span class="store-dot" style="background:#00A95C"></span>
          <span>ترب</span>
        </div>
        <div class="store-item">
          <span class="store-dot" style="background:#F5A623"></span>
          <span>ایمالز</span>
        </div>
        <div class="store-item">
          <span class="store-dot" style="background:#6E4BEC"></span>
          <span>باسلام</span>
        </div>
      </div>
    </div>
  </div>

  <!-- نتایج -->
  <div id="results-state" class="hidden">
    <div class="results-header">
      <div class="results-title-group">
        <span class="section-label">بهترین قیمت‌ها</span>
        <span id="results-count" class="results-count"></span>
      </div>
      <div class="results-actions">
        <button id="toggle-grid-btn" class="icon-btn" title="تغییر نما">
          <!-- Grid Icon -->
          <svg id="icon-grid" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <!-- List Icon (Hidden initially) -->
          <svg id="icon-list" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- فیلتر -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">همه</button>
      <button class="filter-btn" data-filter="digikala">دیجی‌کالا</button>
      <button class="filter-btn" data-filter="torob">ترب</button>
      <button class="filter-btn" data-filter="emalls">ایمالز</button>
      <button class="filter-btn" data-filter="basalam">باسلام</button>
      <button class="filter-btn" data-filter="divar">دیوار</button>
      <button class="filter-btn" data-filter="sheypoor">شیپور</button>
      <button class="filter-btn" data-filter="snappshop">اسنپ‌شاپ</button>
    </div>

    <!-- لیست نتایج -->
    <div id="results-list" class="results-list"></div>


  </div>

  <!-- خطا -->
  <div id="error-state" class="state-container hidden">
    <div class="empty-icon">⚠️</div>
    <p class="state-text">خطا در جستجو</p>
    <button id="retry-btn" class="retry-btn">تلاش مجدد</button>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
