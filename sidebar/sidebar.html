<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>piqo</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <header class="header">
    <div class="header-logo">
      <div class="logo-wrapper">
        <img class="primary-logo" src="primary-logo.png" width="50" height="24" style="object-fit: contain;" alt="PIQO" />
        <img class="character-logo" src="assets/logo-character.png" alt="piqo character" />
      </div>
    </div>
    <button id="popup-close-btn" class="header-close-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </header>

  <!-- Base Product -->
  <div id="current-product" class="hidden"></div>

  <!-- Loading -->
  <div id="loading-state" class="state-container hidden">
    <div class="loading-view">
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="loading-title">در حال جستجو...</div>
    </div>
  </div>

  <!-- Guide / Default State (When no product is active) -->
  <div id="guide-state" class="state-container">
    <!-- Recent History Card -->
    <div id="recent-history-card" class="recent-card hidden">
      <div class="recent-header">
        <span class="recent-title">آخرین محصولات دیده‌شده</span>
        <button id="clear-history-btn" class="recent-clear-btn" type="button">پاک کردن</button>
      </div>
      <div id="recent-history-list" class="recent-list"></div>
    </div>

    <div class="guide-card">
      <div class="guide-header" id="guide-accordion-toggle">
        <span class="guide-title">راهنما</span>
        <svg class="guide-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </div>
      <div class="guide-body" id="guide-body">
        <a href="https://piqoo.ir/install-extension/" target="_blank" rel="noopener noreferrer" class="guide-item">
          <span class="guide-item-text">راهنمای استفاده از ابزار پیکو</span>
          <svg class="guide-item-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <a href="mailto:hossienkordipour@gmail.com" target="_blank" rel="noopener noreferrer" class="guide-item">
          <span class="guide-item-text">ارتباط با پشتیبانی</span>
          <svg class="guide-item-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <div id="empty-state" class="hidden"></div>

  <!-- Results Section -->
  <div id="results-state" class="hidden">
    <div class="section-header">
      <h2 class="section-title">محصولات مشابه</h2>
      <button class="grid-icon-btn" aria-label="تغییر چیدمان">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect>
        </svg>
      </button>
    </div>

    <div class="filters-row">
      <div class="filters-group">
        <div class="custom-dropdown" id="sort-filter" data-value="match">
          <div class="dropdown-header">مرتبط ترین</div>
          <div class="dropdown-list hidden">
            <div class="dropdown-item selected" data-value="match">مرتبط ترین</div>
            <div class="dropdown-item" data-value="cheap">ارزان ترین</div>
          </div>
        </div>
        <div class="custom-dropdown multiple" id="condition-filter">
          <div class="dropdown-header">
            <span class="header-text">وضعیت کالا</span>
            <span class="clear-filter hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </span>
          </div>
          <div class="dropdown-list hidden">
            <div class="dropdown-item checkbox-item selected" data-value="new">
              <div class="check-box">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
              <span>نو</span>
            </div>
            <div class="dropdown-item checkbox-item selected" data-value="used">
              <div class="check-box">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
              <span>کارکرده</span>
            </div>
          </div>
        </div>
      </div>
      <div class="results-count" id="results-count">۰ محصول</div>
    </div>

    <div id="results-list" class="results-list"></div>
  </div>

  <!-- Error -->
  <div id="error-state" class="state-container hidden">
    <p style="font-size: 12px; color: var(--text-light);">خطا در جستجو</p>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
